<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--accent:#1769aa;--green:#166534}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#153b65,#1769aa);color:white;padding:18px 16px;position:sticky;top:0;z-index:10}header h1{font-size:19px;margin:0}header .meta{font-size:12px;opacity:.85;margin-top:5px}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.tabs{display:flex;gap:4px;overflow:auto;margin-bottom:12px}.tabs button{border:0;border-radius:999px;padding:8px 12px;background:#e8eef6;font-weight:750;white-space:nowrap}.tabs button.on{background:var(--accent);color:#fff}.division{display:none}.division.on{display:block}h2{font-size:18px;border-left:5px solid var(--accent);padding-left:9px}h3{font-size:15px;margin:16px 0 8px}.table{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th,td{padding:7px;border-bottom:1px solid #e8edf3;text-align:center;white-space:nowrap}th{background:#edf4fb}td:nth-child(2),th:nth-child(2){text-align:left}.winner{font-weight:850;color:var(--green)}.bracket{display:flex;gap:12px;overflow:auto}.round{min-width:230px}.match{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff}.mh{font-size:10px;color:var(--muted);background:#f1f5f9;padding:4px 7px}.p{padding:7px;border-top:1px solid #eef2f7}.p.win{font-weight:850;background:#ecfdf5}.scores{font-size:11px;color:var(--muted);padding:5px 7px;border-top:1px dashed #e2e8f0}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.medal{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff}.medal b{font-size:18px}.hint{color:var(--muted);font-size:12px;line-height:1.6}.live{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:850}.error{background:#fff1f2;color:#991b1b;padding:10px;border-radius:10px}.setup input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0 10px}.setup button{border:0;border-radius:8px;padding:9px 12px;background:var(--accent);color:white;font-weight:800}.preview-banner{display:none;background:#fff7ed;color:#9a3412;border-bottom:1px solid #fdba74;padding:8px 14px;text-align:center;font-size:12px;font-weight:850;position:sticky;top:0;z-index:20}.preview-banner.on{display:block}body.preview header{top:34px}@media(max-width:650px){.podium{grid-template-columns:1fr}.wrap{padding:10px}}

/* Production live results + preview */
.result-live-title{text-align:center;font-size:20px;font-weight:650;margin:4px 0 12px}.result-live-block{margin:0 0 12px;overflow:auto}.result-live-matrix{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed;font-size:11px;background:#fff}.result-live-matrix th,.result-live-matrix td{border:1px solid #444;padding:4px 3px;text-align:center;vertical-align:middle}.result-live-matrix .rowname{text-align:left;font-weight:500}.result-live-matrix .teamline{display:block;font-size:9px;color:#555;margin-top:2px}.result-live-matrix .diag{padding:0;position:relative;overflow:hidden;background:#fff}.result-live-matrix .diag svg{position:absolute;inset:0;width:100%;height:100%;display:block}.result-live-matrix .diag line{stroke:#333;stroke-width:1.2;vector-effect:non-scaling-stroke}.result-live-matrix .cell{display:flex;align-items:center;justify-content:center;gap:4px}.result-live-matrix .mark{font-size:17px}.result-live-matrix .scores{display:flex;flex-direction:column;line-height:1.05}.result-live-matrix .winred{color:#e21b23;font-weight:750}.result-live-matrix .summary{text-align:left;font-size:10px;line-height:1.15}.result-live-matrix .rank{font-size:18px;font-weight:800}.live-bracket-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y}.live-bracket-svg{display:block;width:100%;min-width:760px;height:auto}.live-bracket-svg .g{stroke:#666;stroke-width:1.15;fill:none}.live-bracket-svg .r{stroke:#ed1c24;stroke-width:2.5;fill:none}.live-bracket-svg .n{font-size:11px;fill:#222}.live-bracket-svg .nw{font-size:11px;fill:#ed1c24;font-weight:800}.live-bracket-svg .set{font-size:12px;font-weight:800}.live-bracket-svg .setwin{fill:#ed1c24}.live-bracket-svg .gs{font-size:8.5px;fill:#333}.third-live{margin-top:12px}.third-live h4{text-align:center;margin:6px}


.public-brand{display:flex;align-items:center;gap:9px}
.public-mitsudon{width:42px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.public-credit{font-size:10px;opacity:.8;margin-top:3px}
.public-footer{max-width:1100px;margin:4px auto 22px;padding:0 14px;text-align:center;color:var(--muted);font-size:11px}

/* ver.1.7: public results are results-only; long team names never overflow */
.result-live-matrix .rowname{
  white-space:normal!important;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-height:1.2;
}
.result-live-matrix .teamline{
  white-space:normal!important;
  overflow-wrap:anywhere;
  word-break:break-all;
  line-height:1.15;
  max-width:100%;
  font-size:clamp(7px,1.8vw,9px);
}
.match .p{white-space:normal!important;overflow-wrap:anywhere;word-break:break-word;line-height:1.35}
.match .p .hint,.medal .hint{white-space:normal!important;overflow-wrap:anywhere;word-break:break-word}
.live-bracket-svg .n,.live-bracket-svg .nw{font-size:12px}
@media(max-width:650px){
  .result-live-matrix{min-width:560px}
  .result-live-matrix .rowname{font-size:10px}
  .result-live-matrix .teamline{font-size:7.5px}
}


/* ver.1.7: long team names must stay inside public result cards */
.result-live-matrix .teamline,.match .hint,.medal .hint{white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important;max-width:100%!important}
.result-live-matrix .rowname{white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important}
.match .p{min-width:0;white-space:normal!important;overflow-wrap:anywhere!important}

/* ver.1.7: all public result tables use the same line weight */
table,.result-live-matrix{border-collapse:collapse!important;border:1px solid #333!important}
table th,table td,.result-live-matrix th,.result-live-matrix td{border:1px solid #333!important}
.table{border:0!important;border-radius:10px;overflow:auto}
.result-live-matrix .diag line{stroke:#333!important;stroke-width:1!important}



/* ver.1.7: tournament match numbers */
.live-bracket-svg .code{font-size:10px;font-weight:850;fill:#0f4c81;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.third-live .mh{font-weight:850;color:#0f4c81}
</style>

<style>
/* ver.1.10.5: keep tournament match numbers visually separate from game scores */
.live-bracket-svg .code{font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
</style>

<style>
/* ver.1.10.5: tournament score labels — hide unplayed 0s and keep metadata separated */
.live-bracket-svg .gs{font-size:8px;fill:#333;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round}
.live-bracket-svg .code{font-size:10px;font-weight:900;fill:#0f4c81;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.live-bracket-svg .set{font-size:12px;font-weight:850;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}

/* ver.1.10.20: public timetable + preliminary match numbers */
/* ver.1.10.20.1: timetable is visible only while its own tab is selected */
.public-schedule-view{display:none}
.public-schedule-view.on{display:block}

.public-schedule-summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.public-schedule-chip{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#eef2f7}
.public-schedule-chip.done{background:#dcfce7;color:#166534}
.public-schedule-chip.current{background:#ffedd5;color:#9a3412}
.public-schedule-table th,.public-schedule-table td{padding:7px 6px}
.public-schedule-table tr.ps-done td{background:#f0fdf4;color:#365314}
.public-schedule-table tr.ps-current td{background:#fff7ed}
.public-schedule-table tr.ps-current{outline:3px solid #f59e0b;outline-offset:-3px}
.public-schedule-table .ps-status{font-weight:850}
.public-schedule-table .ps-code{font-weight:900;color:#0f4f83}
.public-schedule-table .ps-vs{text-align:left;white-space:normal;min-width:210px;line-height:1.35}
.public-schedule-table .ps-team{display:block;color:var(--muted);font-size:10px}
.result-live-matrix td.live-match-cell{position:relative;min-width:74px;padding-top:19px}
.result-live-matrix .live-pre-code{position:absolute;top:2px;right:4px;font-size:8.5px;font-weight:900;color:#0f4f83;line-height:1;background:rgba(255,255,255,.86);padding:1px 2px;border-radius:3px}
@media(max-width:650px){
 .public-schedule-table{min-width:760px}
 .public-schedule-summary{gap:5px}
}

</style>

<style>
/* ===== ver.1.10.20: sticky public navigation ===== */
#tabs{
  position:sticky!important;
  top:var(--public-tabs-top,0px)!important;
  z-index:18!important;
  background:rgba(243,246,250,.97)!important;
  padding:8px 4px!important;
  margin:0 -4px 12px!important;
  box-shadow:0 4px 10px rgba(15,23,42,.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
#tabs::-webkit-scrollbar{height:3px}
#tabs .program-link-v11022{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  border:0;
  border-radius:999px;
  padding:8px 12px;
  background:#fff7ed;

.public-timetable-scroll{
  overflow:auto;

.public-timetable-grid td{

  white-space:normal!important;
}

  min-width:150px;

}

}
.public-timetable-grid .ptt-court-staff{

  min-width:78px;

  z-index:4;
  box-shadow:2px 0 0 rgba(0,0,0,.12);

.public-timetable-grid .ptt-time{

  font-weight:800;
}

  background:#fff;

}
.public-timetable-grid .ptt-match-cell.ptt-done{
  background:#f0fdf4;
}
.public-timetable-grid .ptt-match-cell.ptt-current{

}
.public-timetable-grid .ptt-match-cell.ptt-future{

}
.public-timetable-grid .ptt-empty{

}
.public-timetable-grid .ptt-code{

  font-weight:950;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.public-timetable-grid .ptt-status{
  display:inline-block;
  border-radius:999px;
  padding:2px 5px;
  font-size:8px;
  line-height:1.15;
  font-weight:900;
  background:rgba(255,255,255,.82);
  color:#334155;
}
.public-timetable-grid .ptt-current .ptt-status{
  background:#f97316;
  color:#fff;
}
.public-timetable-grid .ptt-done .ptt-status{
  background:#16a34a;
  color:#fff;
}
.public-timetable-grid .ptt-names{
  flex:1;
  padding:5px 4px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}
.public-timetable-grid .ptt-player{
  line-height:1.08;
  min-width:0;
}
.public-timetable-grid .ptt-player b{
  display:block;
  font-size:13px;
  font-weight:900;
  white-space:normal;
  overflow-wrap:anywhere;
}
.public-timetable-grid .ptt-team{
  display:block;
  margin-top:2px;
  color:#475569;
  font-size:8px;
  line-height:1.05;
  white-space:normal;
  overflow-wrap:anywhere;
}
.public-timetable-grid .ptt-vs{
  display:none;
}
.public-timetable-legend{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:0 0 10px;
}
.public-timetable-note{
  font-size:11px;
  color:var(--muted);
  margin:8px 0 0;
}
.ptt-legend-box{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:800;
}
.ptt-legend-swatch{
  width:18px;
  height:12px;
  border:1px solid #94a3b8;
  display:inline-block;
}
.ptt-legend-swatch.done{background:#f0fdf4}
.ptt-legend-swatch.current{background:#fff7ed;box-shadow:inset 0 0 0 2px #f59e0b}
.ptt-legend-swatch.future{background:#fff}
@media(max-width:650px){
  #tabs{padding-top:6px!important;padding-bottom:6px!important}
  .public-timetable-card{padding:7px!important}
  .public-timetable-grid .ptt-corner,
  .public-timetable-grid .ptt-time-cell{width:64px;min-width:64px}
  .public-timetable-grid .ptt-court-head{width:126px;min-width:126px}
  .public-timetable-grid .ptt-court-no{font-size:16px}
  .public-timetable-grid .ptt-court-staff{font-size:8px}
  .public-timetable-grid .ptt-time{font-size:16px}
  .public-timetable-grid .ptt-time-sub{font-size:8px;margin-top:4px}
  .public-timetable-grid .ptt-match-cell,
  .public-timetable-grid .ptt-empty,
  .public-timetable-grid .ptt-match{height:86px;min-height:86px}
  .public-timetable-grid .ptt-code{font-size:11px;min-height:23px}
  .public-timetable-grid .ptt-player b{font-size:12px}
  .public-timetable-grid .ptt-team{font-size:7px}
}

.ptt-progress-anchor-v11022{scroll-margin-top:180px}
</style>

<div class="wrap"><div id="setup" class="card setup" style="display:none"><h2>公開ページ設定</h2><div class="hint">URLにFirebase Database URLと大会IDがない場合のみ表示されます。</div><label>Database URL</label><input id="db"><label>大会ID</label><input id="tid"><button id="go">表示URLを作成</button></div><div id="status"></div><div id="rules" class="card hint"></div><div id="tabs" class="tabs"></div><div id="content"></div></div><div class="public-footer">制作：飯綱ラブオール</div>
<script>
'use strict';
const qs=new URLSearchParams(location.search);const preview=qs.get('preview')==='1';let db=qs.get('db')||'',tid=qs.get('id')||'',timer=null,current='schedule';
let initialProgressJumpDoneV11022=false;
let lastRemoteStampV11014='',bracketTouchingV11014=false,pendingRenderV11014=null;
const bracketScrollV11014=new Map();
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
if(preview){
 document.body.classList.add('preview');document.querySelector('#previewBanner').classList.add('on');document.querySelector('#setup').style.display='none';document.querySelector('#rules').style.display='block';document.querySelector('#updated').textContent='プレビュー待機中';
 window.addEventListener('message',ev=>{const m=ev.data;if(!m||m.type!=='badminton-public-preview'||!m.payload)return;lastRemoteStampV11014=payloadStampV11014(m.payload);if(bracketTouchingV11014)pendingRenderV11014=m.payload;else render(m.payload)});
 try{window.opener?.postMessage({type:'badminton-public-preview-ready'},'*')}catch(e){}
}else if(!db||!tid){document.querySelector('#setup').style.display='block';document.querySelector('#rules').style.display='none';document.querySelector('#go').onclick=()=>{const d=document.querySelector('#db').value.replace(/\/$/,''),i=document.querySelector('#tid').value.trim();if(!d||!i)return;location.href=location.pathname+'?db='+encodeURIComponent(d)+'&id='+encodeURIComponent(i)}}else{load();timer=setInterval(load,3000)}
function payloadStampV11014(d){
 if(d?.updatedAt!=null)return String(d.updatedAt);
 try{return JSON.stringify(d)}catch(e){return String(Date.now())}
}
async function load(){try{const r=await fetch(db.replace(/\/$/,'')+'/tournaments/'+encodeURIComponent(tid)+'.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('データを取得できません ('+r.status+')');const d=await r.json();if(!d)throw new Error('大会データがまだ公開されていません');const stamp=payloadStampV11014(d);if(stamp!==lastRemoteStampV11014){lastRemoteStampV11014=stamp;if(bracketTouchingV11014)pendingRenderV11014=d;else render(d)}document.querySelector('#status').innerHTML=''}catch(e){document.querySelector('#status').innerHTML='<div class="error">'+esc(e.message)+'</div>';document.querySelector('#updated').textContent='再接続中...'}}
function saveBracketScrollV11014(){
 document.querySelectorAll('#content .division').forEach((sec,di)=>{
  sec.querySelectorAll('.live-bracket-wrap').forEach((el,bi)=>{
   bracketScrollV11014.set(di+':'+bi,{left:el.scrollLeft,ratio:(el.scrollWidth>el.clientWidth?el.scrollLeft/(el.scrollWidth-el.clientWidth):0)})
  })
 })
}
function bindBracketScrollV11014(){
 document.querySelectorAll('#content .division').forEach((sec,di)=>{
  sec.querySelectorAll('.live-bracket-wrap').forEach((el,bi)=>{
   const key=di+':'+bi,saved=bracketScrollV11014.get(key);
   if(saved){
    const max=Math.max(0,el.scrollWidth-el.clientWidth);
    const left=Math.min(max,Number.isFinite(saved.left)?saved.left:max*(saved.ratio||0));
    el.scrollLeft=left
   }
   el.addEventListener('scroll',()=>{const max=Math.max(0,el.scrollWidth-el.clientWidth);bracketScrollV11014.set(key,{left:el.scrollLeft,ratio:max?el.scrollLeft/max:0})},{passive:true});
   const start=()=>{bracketTouchingV11014=true};
   const end=()=>{bracketTouchingV11014=false;if(pendingRenderV11014){const p=pendingRenderV11014;pendingRenderV11014=null;setTimeout(()=>render(p),80)}};
   el.addEventListener('touchstart',start,{passive:true});
   el.addEventListener('touchend',end,{passive:true});
   el.addEventListener('touchcancel',end,{passive:true});
   el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')start()},{passive:true});
   el.addEventListener('pointerup',e=>{if(e.pointerType==='touch')end()},{passive:true});
   el.addEventListener('pointercancel',e=>{if(e.pointerType==='touch')end()},{passive:true});
  })
 })
}
function render(d){
 saveBracketScrollV11014();
 document.title=(d.name||'大会')+' 速報';
 document.querySelector('#title').textContent=d.name||'大会速報';
 const t=d.updatedAt?new Date(d.updatedAt):new Date();
 document.querySelector('#updated').textContent=(preview?'プレビュー更新 ':'最終更新 ')+t.toLocaleTimeString('ja-JP');
 document.querySelector('#rules').innerHTML='<b>'+esc(d.date||'')+'</b><br>予選：'+esc(d.rules?.pre||'')+'　／　決勝：'+esc(d.rules?.final||'');
 const divs=d.divisions||[],hasSchedule=(d.schedule||[]).length>0,tabs=document.querySelector('#tabs');
 if(current==='schedule'&&!hasSchedule)current=0;
 if(typeof current==='number'&&current>=divs.length)current=0;
 tabs.innerHTML='<a class="program-link-v11022" href="program.pdf" target="_blank" rel="noopener" aria-label="大会プログラムPDFを開く">大会プログラム</a>'
   +(hasSchedule?'<button class="'+(current==='schedule'?'on':'')+'" data-view="schedule">タイムテーブル</button>':'')
   +divs.map((x,i)=>'<button class="'+(i===current?'on':'')+'" data-i="'+i+'">'+esc(x.name)+'</button>').join('');
 tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   current=b.dataset.view==='schedule'?'schedule':+b.dataset.i;
   render(d)
 });
 let content='';
 if(hasSchedule)content+='<section class="public-schedule-view '+(current==='schedule'?'on':'')+'">'+publicScheduleHtmlV11019(d)+'</section>';
 content+=divs.map((x,i)=>'<section class="division '+(i===current?'on':'')+'">'+divisionHtml(x)+'</section>').join('');
 document.querySelector('#content').innerHTML=content;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{bindBracketScrollV11014();syncPublicStickyTabsV11019();scrollToInitialProgressV11022()}))
}

function publicScheduleHtmlV11019(d){
 const xs=[...(d?.schedule||[])].sort((a,b)=>(Number(a.minute)||0)-(Number(b.minute)||0)||Number(a.court)-Number(b.court));
 if(!xs.length)return'<div class="card"><div class="empty">タイムテーブルはまだ公開されていません。</div></div>';
 const done=xs.filter(x=>x.done).length,remaining=xs.filter(x=>!x.done);
 const currentMinute=remaining.length?Math.min(...remaining.map(x=>Number(x.minute)||0)):null;
 const pct=Math.round(done/xs.length*100);
 const courts=Math.max(1,Number(d?.scheduleMeta?.courts)||Math.max(...xs.map(x=>Number(x.court)||0)));
 const staff=Array.isArray(d?.scheduleMeta?.courtStaff)?d.scheduleMeta.courtStaff:[];
 const times=[...new Set(xs.map(x=>Number(x.minute)||0))].sort((a,b)=>a-b);
 const by=new Map(xs.map(x=>[`${Number(x.minute)||0}|${Number(x.court)||0}`,x]));
 const timeLabel=t=>{
   const sample=xs.find(x=>(Number(x.minute)||0)===t);
   return sample?.time||`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
 };
 let h='<h2>タイムテーブル</h2><div class="card public-timetable-card">';
 h+=`<div class="public-schedule-summary"><span class="public-schedule-chip done">終了 ${done} / ${xs.length}試合</span><span class="public-schedule-chip">進行 ${pct}%</span>`;
 if(currentMinute!=null)h+=`<span class="public-schedule-chip current">現在の進行位置：${esc(timeLabel(currentMinute))}</span>`;
 else h+='<span class="public-schedule-chip done">全試合終了</span>';
 h+='</div>';
 h+='<div class="public-timetable-legend"><span class="ptt-legend-box"><span class="ptt-legend-swatch done"></span>終了</span><span class="ptt-legend-box"><span class="ptt-legend-swatch current"></span>現在位置</span><span class="ptt-legend-box"><span class="ptt-legend-swatch future"></span>これから</span></div>';
 h+=`<div class="public-timetable-scroll"><table class="public-timetable-grid" style="min-width:${78+courts*150}px"><thead><tr><th class="ptt-corner">コートNo.</th>`;
 for(let c=1;c<=courts;c++){
   h+=`<th class="ptt-court-head"><div class="ptt-court-no">${c}コート</div>${staff[c-1]?`<div class="ptt-court-staff">${esc(staff[c-1])}</div>`:''}</th>`;
 }
 h+='</tr></thead><tbody>';
 for(const t of times){
   const rowMatches=Array.from({length:courts},(_,i)=>by.get(`${t}|${i+1}`)).filter(Boolean);
   const rowDone=rowMatches.length>0&&rowMatches.every(x=>x.done);
   const rowCurrent=currentMinute!=null&&t===currentMinute;
   const isProgressAnchor=rowCurrent||(currentMinute==null&&t===times[times.length-1]);
   h+=`<tr class="${isProgressAnchor?'ptt-progress-anchor-v11022':''}" data-ptt-minute="${t}" ${isProgressAnchor?'data-current-progress-v11022="1"':''}><th class="ptt-time-cell"><div class="ptt-time">${esc(timeLabel(t))}</div><span class="ptt-time-sub">${rowDone?'終了':rowCurrent?'現在位置':'対戦者'}</span></th>`;
   for(let c=1;c<=courts;c++){
     const x=by.get(`${t}|${c}`);
     if(!x){h+='<td><div class="ptt-empty"></div></td>';continue}
     const isCurrent=!x.done&&currentMinute!=null&&t===currentMinute;
     const cls=x.done?'ptt-done':isCurrent?'ptt-current':'ptt-future';
     const status=x.done?'終了':isCurrent?'現在':'';
     const color=x.color||'#bfe8ed';
     h+=`<td class="ptt-match-cell ${cls}"><div class="ptt-match"><div class="ptt-code" style="background:${esc(color)}">${esc(x.matchCode||'')}${status?`<span class="ptt-status">${status}</span>`:''}</div><div class="ptt-names"><div class="ptt-player"><b>${esc(x.a||'未定')}</b>${x.teamA?`<span class="ptt-team">（${esc(x.teamA)}）</span>`:''}</div><div class="ptt-player"><b>${esc(x.b||'未定')}</b>${x.teamB?`<span class="ptt-team">（${esc(x.teamB)}）</span>`:''}</div></div></div></td>`;
   }
   h+='</tr>';
 }
 h+='</tbody></table></div><div class="public-timetable-note">スマートフォンでは表を横にスライドして各コートをご覧ください。左端の時刻列は固定表示されます。</div></div>';
 return h;
}
function syncPublicStickyTabsV11019(){
 const header=document.querySelector('header');
 const bottom=header?Math.max(0,Math.ceil(header.getBoundingClientRect().bottom)):0;
 document.documentElement.style.setProperty('--public-tabs-top',bottom+'px');
}

function scrollToInitialProgressV11022(){
 if(initialProgressJumpDoneV11022||current!=='schedule')return;
 const row=document.querySelector('[data-current-progress-v11022="1"]');
 if(!row)return;
 initialProgressJumpDoneV11022=true;
 const header=document.querySelector('header');
 const tabs=document.querySelector('#tabs');
 const banner=document.querySelector('#previewBanner');
 const offset=(header?.offsetHeight||0)+(tabs?.offsetHeight||0)+((banner?.classList.contains('on'))?(banner?.offsetHeight||0):0)+12;
 const top=row.getBoundingClientRect().top+window.scrollY-offset;
 window.scrollTo({top:Math.max(0,top),behavior:'auto'});
}

window.addEventListener('resize',()=>requestAnimationFrame(syncPublicStickyTabsV11019),{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(syncPublicStickyTabsV11019,120),{passive:true});

function liveResultCell(block,rowEntry,colEntry,rowPos,colPos){
 const rowSlot=Number.isInteger(rowEntry?.slot)?rowEntry.slot:rowPos;
 const colSlot=Number.isInteger(colEntry?.slot)?colEntry.slot:colPos;
 let m=(block.matches||[]).find(q=>{
   if(Number.isInteger(q.ai)&&Number.isInteger(q.bi))return (q.ai===rowSlot&&q.bi===colSlot)||(q.ai===colSlot&&q.bi===rowSlot);

function publicTieRankedStandingsV11013(list){
 const ss=(list||[]).map((s,i)=>({s,i}));

 const sorted=[...ss].sort(cmp),rankByIndex=new Map();let rank=1,prev=null;
 sorted.forEach((x,i)=>{const k=metric(x).join('|');if(i===0)rank=1;else if(k!==prev)rank=i+1;rankByIndex.set(x.i,rank);prev=k});

}

function shortText(s,n){s=String(s||'');return [...s].length>n?[...s].slice(0,n).join('')+'…':s}
function liveBracket(x){

 function calc(side){const ys=side==='L'?ly:ry;for(let r=0;r<R-1;r++){const rd=rounds[r].matches||[],ph=rd.length/2,st=side==='L'?0:ph,en=side==='L'?ph:rd.length;for(let i=st;i<en;i++){const loc=i-st;let a,b;if(r===0){a=ys[loc*2];b=ys[loc*2+1]}else{const pr=rounds[r-1].matches||[],pp=pr.length/2,ps=side==='L'?0:pp;a=my[`r${r-1}:${ps+loc*2}`];b=my[`r${r-1}:${ps+loc*2+1}`]}my[`r${r}:${i}`]=a==null?b:b==null?a:(a+b)/2}}}

    if(m.winner){const wa=m.winner===m.a,wy=wa?ya:yb;if(wy!=null)o+=`<path class="r" d="M ${src} ${wy} H ${xj}${wy!==y?` V ${y}`:''} H ${nx}"/>`;const pg=playedGames(m);if(pg.length){const gx=(xj+nx)/2;o+=`<text class="gs" x="${gx}" y="${y+12}" text-anchor="middle">`+pg.map((g,ii)=>`<tspan x="${gx}" dy="${ii?8.5:0}">${g[0]}-${g[1]}</tspan>`).join('')+'</text>'}}

 if(R>1){draw('L',left,ly);draw('R',right,ry)}
